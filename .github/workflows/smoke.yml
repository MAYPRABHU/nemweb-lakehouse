# Weekly live check against the real NEMWeb site.
# Catches AEMO format/URL changes early. GitHub emails you if it fails.
name: NEMWeb smoke test

on:
  workflow_dispatch: # "Run workflow" button in the Actions tab
  schedule:
    - cron: "0 22 * * 0" # Sundays 22:00 UTC (Monday morning AEST)

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Pull latest intervals from NEMWeb
        run: nemweb --no-raw run --limit 3
      - name: Quality checks
        run: nemweb check
      - name: Summary
        run: nemweb summary --days 1
